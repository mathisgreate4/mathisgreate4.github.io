<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080d1c"><title>Neon Roll — Matheise4</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d1c;color:#fff;font-family:Arial,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;inset:0;pointer-events:none;padding:18px;display:flex;justify-content:space-between;align-items:flex-start;text-shadow:0 2px 12px #000}.pill{background:#101a32cc;border:1px solid #46eaff66;border-radius:14px;padding:10px 14px;backdrop-filter:blur(8px);font-weight:700}.score{font-size:clamp(20px,4vw,32px);color:#5df5ff}.help{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#101a32cc;border:1px solid #46eaff55;border-radius:12px;padding:10px 14px;font-size:13px;text-align:center;white-space:nowrap;pointer-events:none}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse,#101b36aa,#050914dd);padding:20px}.panel{max-width:420px;width:100%;text-align:center;background:#0c1428ed;border:1px solid #4deeff66;border-radius:22px;padding:30px;box-shadow:0 0 70px #00d9ff22}.panel h1{font-size:clamp(36px,9vw,58px);margin:0 0 8px;letter-spacing:-2px}.panel h1 span{color:#53f4ff}.panel p{color:#b7c9e8;line-height:1.5}.btn{border:0;border-radius:12px;background:linear-gradient(110deg,#00d9ff,#6875ff);color:#04101d;font-weight:900;font-size:17px;padding:14px 28px;cursor:pointer}.small{font-size:12px;color:#91a6c8!important;margin-top:18px}.hidden{display:none}@media(max-width:600px){.help{bottom:12px;font-size:11px}.hud{padding:10px}.pill{padding:8px 10px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud"><div class="pill">NEON ROLL <span style="color:#62efff">◆</span></div><div class="pill">SCORE <span id="score" class="score">0</span><br><small>BEST <span id="best">0</span></small></div></div>
<div class="help">← → or A / D to steer · tap left/right on mobile · SPACE to restart</div>
<div class="overlay" id="overlay"><div class="panel"><h1>NEON <span>ROLL</span></h1><p id="message">Stay on the track, dodge the glowing blocks, and see how far you can roll.</p><button class="btn" id="start">PLAY NOW</button><p class="small">An original arcade runner made for Matheise4.</p></div></div>
<script>
(()=> {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),overlay=document.getElementById('overlay'),message=document.getElementById('message'),startBtn=document.getElementById('start');
let w=0,h=0,dpr=1,running=false,score=0,best=Number(localStorage.getItem('neonroll-best')||0),playerX=0,targetX=0,speed=0.42,items=[],last=0,elapsed=0;
bestEl.textContent=best;
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function reset(){score=0;speed=.42;playerX=0;targetX=0;elapsed=0;items=[];for(let i=0;i<9;i++)items.push({z:i/9+.15,x:(Math.random()-.5)*1.25,kind:Math.random()<.22?'gem':'block',hit:false});scoreEl.textContent='0'}
function start(){reset();running=true;overlay.classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}
function end(){running=false;best=Math.max(best,score);localStorage.setItem('neonroll-best',best);bestEl.textContent=best;message.textContent='You scored '+score+'. The track is waiting for your next run.';startBtn.textContent='PLAY AGAIN';overlay.classList.remove('hidden')}
function key(e){if(['ArrowLeft','ArrowRight',' ','a','d','A','D'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')targetX=Math.max(-1, targetX-.48);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')targetX=Math.min(1,targetX+.48);if(e.key===' '&&!running)start()}
addEventListener('keydown',key);
canvas.addEventListener('pointerdown',e=>{targetX=Math.max(-1,Math.min(1,targetX+(e.clientX<w/2?-.55:.55)))});
startBtn.addEventListener('click',start);
function project(x,z){const horizon=h*.22,depth=1-z,half=(w*.43)*(0.12+depth*.88);return {x:w/2+x*half,y:horizon+depth*(h*.82),half}}
function ball(){const p=project(playerX,.035),rad=Math.max(10,Math.min(23,w*.027));ctx.save();ctx.shadowBlur=26;ctx.shadowColor='#38f4ff';const g=ctx.createRadialGradient(p.x-rad*.35,p.y-rad*.4,2,p.x,p.y,rad);g.addColorStop(0,'#ffffff');g.addColorStop(.25,'#9bffff');g.addColorStop(.7,'#16cce8');g.addColorStop(1,'#07518e');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y-rad,rad,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#bfffff';ctx.lineWidth=2;ctx.stroke();ctx.restore()}
function drawTrack(){const top=project(0,1),bottom=project(0,0);ctx.fillStyle='#101a32';ctx.beginPath();ctx.moveTo(top.x-top.half,top.y);ctx.lineTo(top.x+top.half,top.y);ctx.lineTo(bottom.x+bottom.half,bottom.y);ctx.lineTo(bottom.x-bottom.half,bottom.y);ctx.closePath();ctx.fill();ctx.strokeStyle='#19dffb';ctx.lineWidth=3;ctx.shadowBlur=18;ctx.shadowColor='#00dfff';ctx.stroke();ctx.shadowBlur=0;
for(let i=-1;i<=1;i+=.5){ctx.strokeStyle=i===0?'#5379a8':'#23456c';ctx.lineWidth=i===0?2:1;ctx.beginPath();const a=project(i,1),b=project(i,0);ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
for(let z=.08;z<1;z+=.13){const p=project(0,z);ctx.strokeStyle='#254d78';ctx.beginPath();ctx.moveTo(p.x-p.half,p.y);ctx.lineTo(p.x+p.half,p.y);ctx.stroke()}
}
function drawItem(it){const p=project(it.x,it.z),size=7+(1-it.z)*24;if(it.kind==='gem'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.PI/4);ctx.shadowBlur=18;ctx.shadowColor='#ffe45c';ctx.fillStyle='#ffe45c';ctx.fillRect(-size*.42,-size*.42,size*.84,size*.84);ctx.restore()}else{ctx.save();ctx.shadowBlur=16;ctx.shadowColor='#ff3e8d';ctx.fillStyle='#e93677';ctx.strokeStyle='#ffb0d1';ctx.lineWidth=2;ctx.fillRect(p.x-size/2,p.y-size,size,size);ctx.strokeRect(p.x-size/2,p.y-size,size,size);ctx.restore()}}
function loop(now){if(!running)return;const dt=Math.min((now-last)/16.67,2);last=now;elapsed+=dt;speed=Math.min(.95,.42+elapsed*.0009);score=Math.floor(elapsed/5);scoreEl.textContent=score;playerX+=(targetX-playerX)*.13*dt;playerX=Math.max(-1.15,Math.min(1.15,playerX));
ctx.clearRect(0,0,w,h);const bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#080d1c');bg.addColorStop(1,'#101d3a');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
ctx.fillStyle='#122448';for(let i=0;i<35;i++){const x=(i*173)%w,y=(i*97+elapsed*-.4)%(h*.42);ctx.fillRect(x,y,2,2)}
drawTrack();
items.forEach(it=>{it.z-=speed*.006*dt;if(it.z<.075&&!it.hit){if(it.kind==='block'&&Math.abs(it.x-playerX)<.22){end()}else if(it.kind==='gem'&&Math.abs(it.x-playerX)<.24){score+=10;scoreEl.textContent=score}it.hit=true}drawItem(it)});
items=items.filter(it=>it.z>-.1);while(items.length<10){const lastZ=items.length?Math.max(...items.map(i=>i.z)):1;items.push({z:Math.min(1,lastZ+.13+Math.random()*.1),x:(Math.random()-.5)*1.55,kind:Math.random()<.2?'gem':'block',hit:false})}
ball();if(running)requestAnimationFrame(loop)}
})();
</script>
</body></html>
