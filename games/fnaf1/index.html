<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Five Nights at Freddy's 1</title>
  <base href="https://cdn.jsdelivr.net/gh/blazerida/fnaf@latest/1/">
  <link rel="stylesheet" href="style.css">
  <style>
    html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
    body{display:flex;align-items:center;justify-content:center}
    #game-shell{width:min(100vw,177.78vh);height:min(100vh,56.25vw);display:flex;align-items:center;justify-content:center}
    #MMFCanvas{width:100%;height:100%;object-fit:contain;display:block}
    #progress-container{position:absolute;left:5%;right:5%;top:45%;color:#fff;font:14px Arial,sans-serif}
  </style>
</head>
<body>
  <div id="game-shell">
    <div style="display:inline-block;-webkit-user-select:none;text-align:left;width:100%;height:100%">
      <canvas id="MMFCanvas" width="1280" height="720">Your browser does not support Canvas.</canvas>
    </div>
  </div>
  <div id="progress-container">
    <div style="margin-bottom:6px">Downloading... <span id="download-text">0%</span></div>
    <div style="width:100%;background:#444;border-radius:6px;overflow:hidden"><div id="download-bar" style="height:10px;background:#3b82f6;width:0%;transition:width .2s"></div></div>
    <div style="margin:12px 0 6px">Extracting... <span id="extract-text">0%</span></div>
    <div style="width:100%;background:#444;border-radius:6px;overflow:hidden"><div id="extract-bar" style="height:10px;background:#10b981;width:0%;transition:width .2s"></div></div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
